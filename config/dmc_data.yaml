type: dmc

image_height: 128
image_width: 128
image_channels: 3

strict_tasks: true
sequence_length: 8

# Train/val split fraction (respects trajectory boundaries)
val_fraction: 0.1

# Preprocessed frame shards (contains <task>/<task>_shard*.pt with "frames" tensor)
processed:
  - /mnt/datasets/dreamer4/expert-shards
  - /mnt/datasets/dreamer4/mixed-small-shards
  - /mnt/datasets/dreamer4/mixed-large-shards 

# Raw demo data (contains <task>.pt with "episode", "action", "reward" tensors)
raw:
  - /mnt/datasets/dreamer4/expert
  - /mnt/datasets/dreamer4/mixed-small
  - /mnt/datasets/dreamer4/mixed-large 

task_json_file:
  - /mnt/datasets/dreamer4/tasks.json

tasks:
    - walker-stand
    - walker-walk
    - walker-run
    - cheetah-run
    - reacher-easy
    - reacher-hard
    - acrobot-swingup
    - pendulum-swingup
    - cartpole-balance
    - cartpole-balance-sparse
    - cartpole-swingup
    - cartpole-swingup-sparse
    - cup-catch
    - finger-spin
    - finger-turn-easy
    - finger-turn-hard
    - hopper-stand
    - hopper-hop
    - walker-walk-backward
    - walker-run-backward
    - cheetah-run-backward
    - cheetah-run-front
    - cheetah-run-back
    - cheetah-jump
    - hopper-hop-backward
    - cup-spin
    - pendulum-spin
    - jumper-jump
    - reacher-three-easy
    - reacher-three-hard
